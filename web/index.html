<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>expand — know the delivery date before you promise it</title>
<meta name="description" content="Capacity-aware delivery scheduling for Expand's proposal pipeline. Reads what each designer is already committed to and answers when." />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Brand Arabic face, per guideline 5.6–5.8. Latin falls back to Arial,
     which the guideline names as the system font when Helvetica Now is absent. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   expand — delivery estimator
   Brand tokens taken from Brand Guidelines 2025 v1, section 4.5.
   ========================================================================== */
:root {
  color-scheme: dark;

  /* --- brand, verbatim from the guideline --- */
  --black:    #000000;
  --midnight: #5230bf;   /* Midnight Purple */
  --brand:    #915bf5;   /* Purple Heart    */
  --selago:   #e8d9fa;
  --biloba:   #bd96f2;
  --lilac:    #f2ebfa;

  /* --- surfaces --- */
  --bg:   #000000;
  --s-1:  #101014;       /* panel — the surface the palette was validated on */
  --s-2:  #17171d;
  --s-3:  #1f1f28;

  /* --- ink --- */
  --ink1: #ffffff;
  --ink2: #b9b6c6;
  --ink3: #7d7a8c;
  --ink4: #4e4b5c;

  --line:  #232330;
  --line2: #30303f;

  /* --- categorical series ---
     node scripts/validate_palette.js "#915bf5,#d95926,#199e70,#c98500" \
       --mode dark --surface "#101014"   ->  ALL CHECKS PASS
     Brand purple takes slot 1 so the primary team reads as the brand. */
  --s1: #915bf5;   /* 3D      */
  --s2: #d95926;   /* 2D      */
  --s3: #199e70;   /* content */
  --s4: #c98500;

  /* Status slots. `--info` is deliberately outside the categorical set so a
     status pill never wears a series colour. Contrast on #101014 verified
     with the palette validator: all four pass 3:1. */
  --info:     #4c8dff;
  --ok:       #0ca30c;
  --warn:     #fab219;
  --critical: #d03b3b;

  --sans: "Helvetica Now Display", "Helvetica Neue", Arial, Helvetica, sans-serif;
  --ar: "IBM Plex Sans Arabic", var(--sans);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;

  --r: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink1);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
html[lang="ar"] body { font-family: var(--ar); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* ============================== the app shell =============================
   A fixed rail on the inline-start edge and a scrolling column beside it.
   Grid rather than position:fixed so the sidebar cannot cover content, and
   so RTL flips the whole layout for free — in an RTL document the first
   grid column simply lands on the right.
   ========================================================================= */
#root { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

.side {
  background: var(--s-1); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px;
  padding: 18px 12px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.side__brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 18px; }
.side__nav { display: grid; gap: 2px; align-content: start; }
.side__label {
  font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink4); padding: 16px 10px 6px;
}
.side__foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }

.navbtn {
  display: flex; align-items: center; gap: 11px; width: 100%;
  height: 38px; padding: 0 10px; border-radius: 8px; font-size: 13.5px;
  color: var(--ink2); text-align: start; border: 1px solid transparent;
}
.navbtn svg { width: 17px; height: 17px; flex: none; opacity: .75; }
.navbtn:hover { color: var(--ink1); background: var(--s-2); }
.navbtn.is-on {
  color: #fff; background: linear-gradient(90deg, var(--midnight), var(--brand));
  border-color: transparent; font-weight: 600;
}
html[dir="rtl"] .navbtn.is-on { background: linear-gradient(270deg, var(--midnight), var(--brand)); }
.navbtn.is-on svg { opacity: 1; }
.navbtn__n {
  margin-inline-start: auto; font-size: 11px; font-weight: 700;
  background: var(--s-3); color: var(--ink2); border-radius: 999px; padding: 1px 7px;
}
.navbtn.is-on .navbtn__n { background: rgba(0,0,0,.25); color: #fff; }

/* The person, at the bottom of the rail where every CRM puts them. */
.mecard { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 9px; }
.mecard:hover { background: var(--s-2); }
.mecard__t { display: grid; min-width: 0; }
.mecard__n { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mecard__r { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ava {
  width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
  font-size: 12.5px; font-weight: 700; color: #10041f; background: var(--c, var(--brand));
}

.main { min-width: 0; display: flex; flex-direction: column; }
.page { padding: 18px 22px 40px; width: 100%; max-width: 1560px; margin: 0 auto; }

/* ------------------------------- top bar ---------------------------------- */
.head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 22px; border-bottom: 1px solid var(--line);
  background: var(--s-1); position: relative;
}
/* Echo of the brand "Lines System" (guideline 7.0) */
.head::after {
  content: ""; position: absolute; inset-inline-end: 0; top: 0; bottom: 0; width: 160px;
  background: repeating-linear-gradient(90deg,
    var(--midnight) 0 2px, transparent 2px 9px);
  opacity: .3; mask-image: linear-gradient(90deg, transparent, #000);
  pointer-events: none;
}
html[dir="rtl"] .head::after { transform: scaleX(-1); }
.brand { display: flex; align-items: center; gap: 12px; }
.wordmark {
  font-size: 19px; font-weight: 700; letter-spacing: -.03em; color: var(--ink1);
}
.sep { width: 1px; height: 26px; background: var(--line2); }
.h1 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.sub { font-size: 12px; color: var(--ink3); }
.head__actions { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; z-index: 1; }

/* Search sits in the bar and filters the table on the page, so it never
   promises more than it does — placeholder names the thing it filters. */
.search { position: relative; flex: 1 1 200px; max-width: 380px; z-index: 1; }
.search svg { position: absolute; inset-inline-start: 11px; top: 9px; width: 15px; height: 15px; color: var(--ink4); }
.search input {
  width: 100%; height: 34px; border-radius: 9px; padding-inline: 34px 12px;
  background: var(--s-2); border: 1px solid var(--line2); color: var(--ink1); font-size: 13px;
}
.search input::placeholder { color: var(--ink4); }
.search input:focus { border-color: var(--line2); outline-offset: 0; }

@media (max-width: 900px) {
  /* Icon rail: the labels go, the navigation does not. */
  #root { grid-template-columns: 62px minmax(0, 1fr); }
  .side { padding: 14px 8px; }
  .side__label, .navbtn span, .wordmark, .mecard__t, .navbtn__n { display: none; }
  .navbtn { justify-content: center; padding: 0; }
  .side__brand { justify-content: center; padding: 2px 0 14px; }
  .mecard { justify-content: center; padding: 6px 0; }
  /* The rail is 62px wide; a "Sign in" button in it wraps to two lines and
     looks broken. The top bar already offers the same action. */
  .side__foot--cta { display: none; }
  .head { padding: 10px 14px; }
  .page { padding: 14px 14px 32px; }
}

.btn {
  height: 34px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
  background: var(--s-2); border: 1px solid var(--line2); color: var(--ink1);
}
.btn:hover { background: var(--s-3); }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #10041f; font-weight: 600; }
.btn--primary:hover { background: var(--biloba); }
.btn--ghost { background: none; color: var(--ink3); }
.btn--ghost:hover { color: var(--ink1); }
.btn--lang { font-family: var(--ar); }

/* -------------------------------- layout --------------------------------- */
.grid { display: grid; grid-template-columns: 280px minmax(0,1fr) 300px; gap: 14px; align-items: start; }
.col { display: grid; gap: 14px; }
@media (max-width: 1180px) { .grid { grid-template-columns: 260px minmax(0,1fr); } }
@media (max-width: 860px)  { .grid { grid-template-columns: 1fr; } }

.card { background: var(--s-1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.card--wide { margin-top: 14px; }
.card__h {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px; border-bottom: 1px solid var(--line);
  font-size: 12.5px; font-weight: 600; letter-spacing: .01em;
}
.card__sub, .badge { margin-inline-start: auto; font-size: 11px; color: var(--ink3); font-family: var(--mono); }
.badge { background: var(--s-3); border-radius: 20px; padding: 1px 8px; }
.card__b { padding: 14px; }
.stack { display: grid; gap: 10px; }
.hint { font-size: 11.5px; color: var(--ink3); line-height: 1.5; }

/* --------------------------------- rows ---------------------------------- */
.row { display: flex; align-items: center; gap: 9px; }
.row__label { font-size: 13px; }
.row__meta { margin-inline-start: auto; font-family: var(--mono); font-size: 11px; color: var(--ink3); }
.row--proj { padding: 7px 9px; background: var(--s-2); border-radius: 8px; }
.row--proj .row__meta { margin-inline-start: 0; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.tag {
  font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
  background: var(--s-3); color: var(--ink2); margin-inline-start: auto;
}
.x { color: var(--ink4); font-size: 16px; line-height: 1; padding: 0 2px; }
.x:hover { color: var(--critical); }

.stepper { margin-inline-start: auto; display: flex; align-items: center; gap: 2px; }
.stepper button {
  width: 24px; height: 24px; border-radius: 6px; background: var(--s-2);
  border: 1px solid var(--line2); color: var(--ink2); font-size: 14px; line-height: 1;
}
.stepper button:hover { background: var(--brand); color: #10041f; border-color: var(--brand); }
.stepper b { min-width: 22px; text-align: center; font-family: var(--mono); font-size: 13px; }

/* --------------------------------- form ---------------------------------- */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* An input's intrinsic width is about 20 characters, so a two-column grid
   refuses to shrink below ~350px and pushes itself out of the card on a
   phone. One column below that, and min-width:0 so a field can always be
   narrower than the text it expects. */
@media (max-width: 700px) { .fields { grid-template-columns: minmax(0, 1fr); } }
/* `align-content: start` is load-bearing. A label is a grid whose two rows
   size to content, but as a grid ITEM it stretches to its row's height — and a
   stretched grid container with auto rows shares the spare height out between
   them. Beside a tall element that pushed the caption to the ceiling and the
   input to the floor with 150px of nothing between. */
.f { display: grid; gap: 5px; min-width: 0; align-content: start; }
.f input, .f select, .f textarea { min-width: 0; max-width: 100%; }
.f--wide { grid-column: 1 / -1; }

/* The six-digit code. Monospaced and widely tracked because it is copied by
   eye from an email — proportional digits at body size are where a 6 becomes
   an 8. Centred, because there is nothing else in the field to align to. */
.codein {
  font: 600 22px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
  letter-spacing: .32em; text-align: center; padding-inline-start: .32em !important;
}
.f span { font-size: 11.5px; color: var(--ink3); }
.f input, .f select {
  height: 36px; padding: 0 10px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--line2); outline: 0;
}
.f input:focus, .f select:focus { border-color: var(--brand); }
.actions { display: flex; gap: 8px; margin-top: 12px; }

/* ------------------------------- the result ------------------------------ */
.card--result { border-color: var(--line2); }
.card--empty .empty { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 34px 24px; }
.card--empty p { color: var(--ink3); font-size: 12.5px; max-width: 44ch; }

.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.compare__side { padding: 14px; border-radius: 10px; background: var(--s-2); border: 1px solid var(--line); }
.compare__side--real { border-color: var(--brand); background: linear-gradient(180deg, rgba(145,91,245,.13), transparent); }
.compare__k { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: .06em; }
.compare__v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; }
.compare__side--naive .compare__v { color: var(--ink3); text-decoration: line-through; text-decoration-color: var(--ink4); }
.compare__n { font-size: 11.5px; color: var(--ink3); }
.compare__arrow { text-align: center; display: grid; gap: 2px; padding: 0 4px; }
.compare__arrow b { font-size: 15px; color: var(--warn); font-weight: 700; }
.compare__arrow span { font-size: 10.5px; color: var(--ink3); max-width: 12ch; display: block; }

.deadline { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; }
.deadline.ok  { background: rgba(12,163,12,.12); color: #6ee36e; }
.deadline.bad { background: rgba(208,59,59,.12); color: #ff8f8f; }

.split { margin-top: 16px; }
.split__bar { display: flex; height: 9px; border-radius: 20px; overflow: hidden; background: var(--s-3); }
.split__q { background: repeating-linear-gradient(45deg, var(--ink4) 0 4px, var(--s-3) 4px 8px); }
.split__w { background: var(--brand); }
.split__legend { display: flex; gap: 16px; margin-top: 7px; font-size: 11.5px; color: var(--ink2); }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-inline-end: 6px; }
.sw--q { background: repeating-linear-gradient(45deg, var(--ink4) 0 3px, var(--s-3) 3px 6px); }
.sw--w { background: var(--brand); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 1px; background: var(--line); margin-top: 16px; border-radius: 8px; overflow: hidden; }
.fact { background: var(--s-1); padding: 11px 12px; display: grid; gap: 3px; }
.fact__k { font-size: 10.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; }
.fact__v { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.fact__n { font-size: 11px; color: var(--ink3); line-height: 1.4; }
.conf { text-transform: capitalize; }
.conf--high { color: #6ee36e; } .conf--medium { color: var(--warn); } .conf--low { color: #ff8f8f; }

.sec { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: start; font-size: 10.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; padding: 12px 8px 8px; font-weight: 600; }
.tbl td { padding: 8px; border-top: 1px solid var(--line); }
.tbl .n { text-align: end; }
.tbl tr.drive td { background: rgba(145,91,245,.08); }
.tbl tr.err td { color: #ff8f8f; }
.who { color: var(--ink3); font-size: 11.5px; }

/* ------------------------------ utilisation ------------------------------ */
.util { display: grid; gap: 6px; }
.util__h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.util__n { margin-inline-start: auto; font-size: 11px; color: var(--ink3); }
.util__h b { font-family: var(--mono); font-size: 12px; }
.util__h b.warm { color: var(--warn); } .util__h b.hot { color: var(--critical); }
.util__bar { height: 7px; border-radius: 20px; background: var(--s-3); overflow: hidden; }
.util__bar span { display: block; height: 100%; border-radius: 20px; }

.lever { padding: 10px 11px; background: var(--s-2); border-radius: 8px; border: 1px solid var(--line); }
.lever__t { font-size: 12.5px; margin-bottom: 3px; }
.lever__v { font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.lever__s { font-size: 11px; color: #6ee36e; font-weight: 500; }

/* --------------------------------- gantt --------------------------------- */
.gantt { display: grid; gap: 5px; overflow-x: auto; }
.gantt__axis {
  display: grid; grid-template-columns: 120px repeat(var(--cols), minmax(16px, 1fr));
  font-family: var(--mono); font-size: 9.5px; color: var(--ink4); padding-inline-start: 120px;
}
.gantt__axis span { grid-row: 1; }
.gantt__row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; }
.gantt__name { font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt__track {
  display: grid; grid-template-columns: repeat(var(--cols), minmax(16px, 1fr));
  gap: 2px; background: var(--s-2); border-radius: 6px; min-height: 22px; padding: 2px;
}
.bar {
  grid-row: 1; height: 18px; border-radius: 4px; font-size: 10px; color: #10041f;
  display: flex; align-items: center; padding: 0 6px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; font-weight: 600;
}
.bar--new { outline: 2px solid var(--ink1); outline-offset: -2px; }

/* ==========================================================================
   Landing, roster, profiles, pipeline.
   ========================================================================== */

.headtext { min-width: 0; }
.brand { border: 0; background: none; padding: 0; }
.nav { display: flex; gap: 4px; margin-inline-start: 20px; flex-wrap: wrap; }
.navbtn {
  height: 30px; padding: 0 11px; border-radius: 7px; font-size: 12.5px;
  color: var(--ink3); border: 1px solid transparent;
}
.navbtn:hover { color: var(--ink1); background: var(--s-2); }
.navbtn.is-on { color: var(--ink1); background: var(--s-2); border-color: var(--line2); }

.card + .card, .hero + .card { margin-top: 14px; }
.card__head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
}
.card__head h2 { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
/* Blocks that set their own padding opt out here rather than fighting this
   rule. Four :not() clauses put it at specificity 0,5,0 — a plain `.uploader`
   never had a chance, which is why the upload form sat flush against the card
   header with its button on the divider. Add to the list; do not try to win. */
.card > :not(.card__head):not(.board):not(.loadlist):not(.deptblock):not(.uploader) { padding: 0 16px; }
.card > :not(.card__head):first-child { padding-top: 14px; }
.card > :last-child:not(.board):not(.stats):not(.loadlist) { padding-bottom: 14px; }
.muted { color: var(--ink3); }
.small { font-size: 11.5px; }
.block { display: block; }
.bad { color: #ff8f8f; }
.link { color: var(--brand); font-size: 12.5px; }
.crumb { padding: 0 0 12px; }
.note {
  font-size: 12px; color: var(--ink3); line-height: 1.65;
  border-inline-start: 2px solid var(--line2); padding-inline-start: 11px !important;
  margin: 14px 16px;
}
.note--lead { color: var(--ink2); border-inline-start-color: var(--brand); }
.tbl .num { text-align: end; }
.tbl--tight td { padding: 6px 8px; }
.chip {
  font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink3);
}
.chip--warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

/* ---------------------------------- hero --------------------------------- */
.hero { padding: 46px 4px 34px; max-width: 720px; }
.hero__eyebrow {
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--brand); font-weight: 600; margin-bottom: 16px;
}
.hero__title {
  font-size: clamp(30px, 5.2vw, 52px); line-height: 1.08; letter-spacing: -.035em;
  font-weight: 700; margin-bottom: 16px;
}
.hero__body { font-size: 16px; line-height: 1.6; color: var(--ink2); }
.hero__cta { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
html[lang="ar"] .hero__title { letter-spacing: 0; line-height: 1.25; }

/* -------------------------------- load list ------------------------------ */
.loadlist { display: grid; }
.loadlist__row {
  display: grid; grid-template-columns: 190px minmax(90px,1fr) 96px 128px;
  gap: 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line);
}
.loadlist__row:first-child { border-top: 0; }
.loadlist__who { display: grid; min-width: 0; }
.loadlist__who strong { font-size: 13px; font-weight: 600; }
.loadlist__num { display: grid; text-align: end; }
.loadlist__num strong { font-size: 14px; font-variant-numeric: tabular-nums; }
.loadbar { height: 8px; border-radius: 999px; background: var(--s-3); overflow: hidden; }
.loadbar i { display: block; height: 100%; border-radius: 999px; }
.loadrow { display: grid; gap: 7px; margin-top: 4px; }
@media (max-width: 780px) {
  .loadlist__row { grid-template-columns: 1fr 1fr; }
  .loadlist__who, .loadbar, .deptrow__mid { grid-column: 1 / -1; }
  .loadlist__num { text-align: start; }
}

/* ---------------------- the business, by function ------------------------ */
/* Same four-column rhythm as the load list, plus a middle cell that holds the
   bar and the measured line, and a note that spans the row. Departments with
   nobody assigned are dimmed rather than hidden: an empty row is the point. */
.deptrow { row-gap: 8px; }
.deptrow__mid { display: grid; gap: 6px; min-width: 0; }
.deptrow__m { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.deptrow__m b { color: var(--ink2); font-weight: 600; }
.deptrow__note {
  grid-column: 1 / -1; color: var(--ink3); line-height: 1.6;
  border-inline-start: 2px solid var(--line2); padding-inline-start: 11px;
  margin-top: 2px; max-width: 78ch;
}
.deptrow--empty .loadlist__who strong, .deptrow--empty .loadlist__num strong { color: var(--ink3); }
.loadlist__who strong .dot {
  width: 8px; height: 8px; border-radius: 3px; display: inline-block;
  margin-inline-end: 8px; vertical-align: baseline;
}

/* ------------------------------ role picker ------------------------------ */
.deptblock { padding: 16px; border-top: 1px solid var(--line); }
.deptblock:first-of-type { border-top: 0; }
.deptblock__title {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink3); margin-bottom: 11px;
}
.deptblock__title i { width: 8px; height: 8px; border-radius: 3px; }
.whogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 9px; }
.whocard {
  display: grid; gap: 3px; text-align: start; padding: 13px 14px;
  background: var(--s-2); border: 1px solid var(--line2); border-radius: var(--r);
  transition: border-color .14s, transform .14s;
}
.whocard:hover { border-color: var(--brand); transform: translateY(-1px); }
.whocard__name { font-size: 14px; font-weight: 600; }
.whocard__load { color: var(--ink3); margin-top: 4px; }
.whocard--vacant { opacity: .5; cursor: default; }
.whocard--vacant:hover { border-color: var(--line2); transform: none; }

/* -------------------------------- profile -------------------------------- */
.profile__head { display: flex; align-items: center; gap: 14px; padding: 18px 16px; flex-wrap: wrap; }
.avatar {
  width: 46px; height: 46px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-size: 19px; font-weight: 700; color: #10041f;
  background: var(--c, var(--brand));
}
.profile__name { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.profile__head .chip { margin-inline-start: auto; }

.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 1px; background: var(--line); border-block: 1px solid var(--line);
  padding: 0 !important; margin-top: 4px;
}
.stat { background: var(--s-1); padding: 13px 16px; display: grid; gap: 3px; }
.stat__n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat__l { font-size: 11px; color: var(--ink3); line-height: 1.35; }
.stat--bad .stat__n { color: #ff8f8f; }
.stat--wide { grid-column: span 2; }
.stat--wide .stat__n { font-size: 15px; }

/* -------------------------------- pipeline ------------------------------- */
.board {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 1px; background: var(--line);
}
.bcol { background: var(--s-1); padding: 14px; display: grid; gap: 9px; align-content: start; }
.bcol__title {
  display: flex; justify-content: space-between; font-size: 11px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); margin-bottom: 2px;
}
.deal {
  background: var(--s-2); border: 1px solid var(--line2); border-radius: 8px; padding: 11px 12px;
  display: grid; gap: 3px;
}
.deal__name { font-size: 13px; font-weight: 600; }
.deal__ar { direction: rtl; text-align: start; }
html[dir="rtl"] .deal__ar { direction: rtl; }
.deal__meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; }
.deal__cost { color: var(--ink2); border-top: 1px solid var(--line); padding-top: 7px; margin-top: 5px; }

.unpriced { padding: 14px 16px 2px; border-top: 1px solid var(--line); }
.unpriced__head { color: var(--ink3); line-height: 1.6; }
.batches { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.batch {
  display: grid; gap: 2px; padding: 9px 12px; border-radius: 8px;
  background: var(--s-2); border: 1px solid var(--line2); min-width: 128px;
}
.batch__n { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

.btn--sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
select.btn--sm { height: 28px; padding: 0 6px; background: var(--s-2); border: 1px solid var(--line2); border-radius: 6px; font-size: 12px; }
/* Two actions can share a row cell — approve/revoke, and "send link". They
   stay on one line and end-align with the column so the eye still finds one
   edge, and wrap rather than widen the table on a narrow screen. */
.rowacts { display: inline-flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.rowacts .btn--ghost { border: 1px solid var(--line2); }

.whoami { margin-inline-end: 4px; }
.subhead { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin: 20px 0 10px; font-weight: 600; }

/* ============================ dashboard header ===========================
   KPI tiles first, then one chart, then the table. The order is deliberate:
   a 200-row table with no summary above it makes the reader do the counting.
   ========================================================================= */
/* Explicit counts rather than auto-fit: with six tiles, auto-fit lands on
   4+2 at common widths and the orphan row reads as a mistake. */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
@media (max-width: 1500px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px)  { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* Eight tiles want four across, not six-plus-an-orphan. */
.kpis--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1180px) { .kpis--4 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px)  { .kpis--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi {
  background: var(--s-1); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 16px; display: grid; gap: 3px; align-content: start; min-width: 0;
}
.kpi__l { font-size: 11.5px; color: var(--ink3); display: flex; align-items: center; gap: 7px; }
.kpi__l i { width: 7px; height: 7px; border-radius: 2px; background: var(--c, var(--brand)); flex: none; }
.kpi__n { font-size: 27px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi__n small { font-size: 14px; font-weight: 600; color: var(--ink3); letter-spacing: 0; }
.kpi__s { font-size: 11.5px; color: var(--ink4); }
.kpi--bad .kpi__n { color: #ff8f8f; }
.kpi--date .kpi__n { font-size: 18px; }

/* Tiles INSIDE a card, on Business highlights. The card already draws a
   border and a surface, so a second border around each tile is a box in a
   box; these sit on the deeper surface with no outline and let the card
   group them. Auto-fit here because the count varies by card (3 and 4). */
.kpis--in { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin: 4px 0 6px; }
.kpis--in .kpi { background: var(--s-2); border-color: transparent; padding: 12px 14px; }
.kpis--in .kpi__n { font-size: 24px; }

/* ------------------------- horizontal bars (highlights) -------------------
   HTML, not SVG. The labels are people's names — long, and half of them
   Arabic — and a grid mirrors under dir="rtl" for free where an SVG's
   absolute coordinates do not. The value rides the end of its own row, so
   there is no axis to read across to and no gridline to draw.            */
.hbars { list-style: none; display: grid; gap: 6px; margin: 8px 0 4px; padding: 0; }
.hb { display: grid; grid-template-columns: minmax(96px, 168px) minmax(0, 1fr) 44px;
      align-items: center; gap: 10px; }
.hb__l { font-size: 12.5px; color: var(--ink2); min-width: 0;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb__sub { display: block; font-size: 10.5px; color: var(--ink4); }
.hb__track { height: 16px; background: var(--s-2); border-radius: 4px; overflow: hidden; }
.hb__fill { display: block; height: 100%; border-radius: 4px; min-width: 3px; }
.hb__n { font-family: var(--mono); font-size: 12.5px; color: var(--ink1);
         text-align: end; font-variant-numeric: tabular-nums; }
.hb--muted .hb__l, .hb--muted .hb__n { color: var(--ink3); }

/* Concentration: a share, so it is drawn against a full-width track — the
   empty part is the point. Red only past the threshold, and the tag beside
   it repeats the verdict in words, so the colour is never carrying it alone. */
.conc { display: block; width: 100%; max-width: 130px; height: 8px;
        background: var(--s-2); border-radius: 4px; overflow: hidden; }
.conc__f { display: block; height: 100%; background: var(--ink3); border-radius: 4px; }
.conc__f--bad { background: var(--critical); }
.conc__n { font-family: var(--mono); font-size: 11px; color: var(--ink3); }
.tbl .tag { margin-inline-start: 0; }
.tag--bad { background: rgba(208, 59, 59, .18); color: #ff9a9a; }

/* ------------------------------- the chart -------------------------------- */
.chartcard { margin-bottom: 14px; }
.chart { display: block; width: 100%; height: auto; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--ink4); font-size: 11px; }
.chart .val { fill: var(--ink2); font-size: 11px; font-weight: 600; }
.chart .bar path { fill: var(--brand); transition: fill .12s; }
.chart .bar:hover path { fill: var(--biloba); }
.chart .now line { stroke: var(--ink4); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .now text { fill: var(--ink3); font-size: 10.5px; }

/* -------------------------------- pills ---------------------------------- */
/* Status is a state, so it gets the reserved status colours and always ships
   with its own word — never colour alone. */
.st {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--c) 16%, transparent);
  color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent);
}
.st i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }

.chipbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.chip--btn { background: var(--s-2); cursor: pointer; }
.chip--btn:hover { color: var(--ink1); border-color: var(--line2); }
.chip--btn.is-on { color: #fff; background: var(--brand); border-color: var(--brand); }

/* ------------------------------- filter bar -------------------------------
   Auto-fit rather than a fixed column count: five selects sit in one row on
   a desktop and stack without a media query on a phone, and the row does not
   scroll sideways — a filter you cannot see is a filter you cannot clear. */
.filterbar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; align-items: end;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--s-2);
}
.filterbar .f--sm select { height: 30px; font-size: 12.5px; }
.chk--inline { flex: none; font-size: 12px; color: var(--ink3); min-width: 0; padding-bottom: 6px; }
.chk--inline input { width: 14px; height: 14px; }
.filterbar .btn { align-self: end; }

/* -------------------------------- chart row -------------------------------
   Two charts that answer one question between them, so they sit side by side
   and share a month axis. They stack below 1080px rather than shrinking: a
   12-column heatmap squeezed into half a phone is unreadable, and the bar
   chart's month labels start colliding. `align-items:start` keeps the shorter
   card its own height instead of stretching it to match the taller one. */
.chartrow {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px; align-items: start;
}
.chartrow > .card { margin-top: 0; }
@media (max-width: 1080px) { .chartrow { grid-template-columns: minmax(0, 1fr); } }

.chartwrap { padding: 10px 12px 0 !important; }
.axis--val { fill: var(--ink1); font-weight: 600; }
/* The "Earlier" column is a multi-year bucket sitting next to one-month bars,
   so it is set apart from them — it must not be read as a thirteenth month.
   NOT with italics: Arabic has no italic form, and the synthetic skew browsers
   apply to أقدم throws a stroke that reads as a stray slash. A rule on the
   month-facing edge works in both scripts, so `border-inline-end` rather than
   border-right — it follows the writing direction. */
.axis--bucket { fill: var(--ink3); }
.heat__colh--bucket, .heat__c--bucket {
  border-inline-end: 1px solid var(--line); padding-inline-end: 6px !important;
}

/* --------------------------------- heatmap --------------------------------
   A grid of counts, not a series set: 21 managers would need 21 categorical
   hues and the palette stops at 8. One sequential hue, and the number stays in
   the cell so magnitude is never colour-alone. */
.heat { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 11.5px; }
.heat th, .heat td { padding: 0; }
/* The name and the total are pinned to the two edges. Adding the Earlier
   column pushed the grid past the card on a laptop, and the first thing to go
   off the edge was the Total — the one column the eye actually lands on. Both
   are anchored with `inset-inline-*` so they pin to the correct side in Arabic
   too, and both need an opaque background or the scrolling cells slide
   underneath and show through. */
.heat__rowh {
  text-align: start; color: var(--ink2); font-weight: 500; white-space: nowrap;
  padding-inline-end: 10px !important; max-width: 190px; overflow: hidden; text-overflow: ellipsis;
  position: sticky; inset-inline-start: 0; z-index: 1; background: var(--s-1);
}
.heat__colh, .heat__tot { color: var(--ink3); font-weight: 600; font-size: 10.5px; text-align: center; }
.heat__tot {
  text-align: end; padding-inline-start: 10px !important; color: var(--ink2);
  position: sticky; inset-inline-end: 0; z-index: 1; background: var(--s-1);
}
.heat__c { text-align: center; }
.heat__box {
  display: grid; place-items: center; min-width: 26px; height: 22px; border-radius: 4px;
  color: #fff; font-size: 10.5px; font-weight: 600; cursor: default;
}
/* The two lightest steps are light enough that white text on them fails
   contrast, so the ink flips to the surface colour rather than staying white
   and being unreadable on exactly the cells that matter most. */
.heat__box[style*="9c6dd3"], .heat__box[style*="b68ee9"] { color: #101014; }
.heat__box--key { min-width: 30px; }
.heatkey { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding: 0 16px 14px !important; }

/* ------------------------------ project detail ---------------------------- */
.factgrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px 18px; padding: 14px 16px !important;
}
.fact { display: grid; gap: 3px; min-width: 0; }
.fact__l { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink3); }
.fact__v { font-size: 13px; color: var(--ink1); overflow-wrap: anywhere; }
.prose { font-size: 13px; line-height: 1.7; color: var(--ink2); white-space: pre-wrap; overflow-wrap: anywhere; }

.filelist { list-style: none; display: grid; gap: 2px; }
.filerow {
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  padding: 9px 0; border-bottom: 1px solid var(--line);
}
.filerow:last-child { border-bottom: 0; }

/* A rule down the left with a dot per entry: the eye follows one line
   instead of hunting for where each row starts. */
.timeline { list-style: none; display: grid; gap: 0; padding-bottom: 6px; }
.timeline__i {
  display: grid; grid-template-columns: 96px 1fr; gap: 12px;
  padding: 10px 0 10px 14px; border-inline-start: 1px solid var(--line2); margin-inline-start: 3px;
  position: relative; font-size: 12.5px;
}
.timeline__i::before {
  content: ''; position: absolute; inset-inline-start: -3.5px; top: 15px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--line2);
}
.timeline__i:first-child::before { background: var(--brand); }
.timeline__d { color: var(--ink3); font-size: 11.5px; }
.timeline__b { color: var(--ink2); line-height: 1.6; overflow-wrap: anywhere; }
@media (max-width: 560px) { .timeline__i { grid-template-columns: 1fr; gap: 3px; } }

/* ------------------------------ table polish ------------------------------ */
.tblwrap { overflow-x: auto; }
.tbl tbody tr { transition: background .1s; }
.tbl tbody tr:hover td { background: var(--s-2); }
.tbl td .link { font-size: 13px; font-weight: 500; }
.tbl__empty { padding: 28px 16px; color: var(--ink3); text-align: center; }
.tbl .stagecell { display: flex; gap: 5px; flex-wrap: wrap; }

/* --------------------------------- sign in -------------------------------- */
.authwrap { display: grid; place-items: center; min-height: 62vh; padding: 20px 0; }
.auth { width: min(420px, 100%); }
.authform { padding: 18px 16px 16px; display: grid; gap: 12px; }
.authform .btn { width: 100%; justify-content: center; }
.authlinks { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.authmsg { font-size: 12.5px; color: var(--ink2); line-height: 1.55; }
.autherr {
  margin: 14px 16px 0; padding: 12px 14px; border-radius: 9px;
  background: rgba(208,59,59,.09); border: 1px solid rgba(208,59,59,.35);
  display: grid; gap: 8px; justify-items: start;
}
.autherr__h { font-size: 13px; font-weight: 600; color: #ff9f9f; }
.autherr__b { color: var(--ink2); line-height: 1.6; }
.f textarea {
  padding: 9px 10px; border-radius: 8px; background: var(--bg);
  border: 1px solid var(--line2); outline: 0; resize: vertical; font: inherit; color: inherit;
}
.f textarea:focus { border-color: var(--brand); }
.f input[type="file"] { padding: 7px; font-size: 12px; height: auto; }

/* ------------------------------ forms in cards ---------------------------- */
.inlineform, .projform { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.projform { border-bottom: 0; max-width: 1100px; }
/* Left to fill a 1440px card, the Name field became a 1450px slot for six
   words. Forms read better with a measure. */

/* ------------------------------ the uploader ------------------------------
   One column, top to bottom: title, then the description under it, then the
   file picker, then the button on the trailing edge where the eye finishes.
   The two fields used to sit side by side, which pushed the description off
   the page on anything narrower than a desktop. */
/* Fixed column widths rather than `max-width` on the form. A capped form is
   narrower than the table beneath it, so its bottom border stopped short of
   the table's header rule and left a step in the card's left-hand edge. The
   form now spans the card — the border runs the full width — while the fields
   keep a readable measure instead of stretching to 900px for a title. */
.uploader {
  display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 480px);
  justify-content: start; align-items: start;
  gap: 14px 18px; padding: 18px 16px;
  border-bottom: 1px solid var(--line);
}
.uploader .f input, .uploader .f textarea { width: 100%; }

/* Fields on one side, picker on the other, button on the trailing edge of the
   whole form. This was three grid areas pinned by `:nth-of-type`, and it broke
   twice: once when the picker grew a wrapper and its selector stopped
   matching, and again because a row-spanning picker taller than both fields
   handed its height to whichever track was `auto` and prised the two fields
   apart. Two columns and a stack — nothing spans, nothing to keep in sync. */
.uploader__fields { display: grid; gap: 14px; align-content: start; min-width: 0; }
.uploader > .dropwrap { align-self: stretch; grid-template-rows: minmax(0, 1fr) auto; }
.uploader > .dropwrap > .drop { height: 100%; }
.uploader > .actions { grid-column: 1 / -1; margin-top: 0; }
@media (max-width: 1060px) {
  .uploader { grid-template-columns: minmax(0, 1fr); }
  /* Stacked, the picker has no neighbour to match, so let it be its own size. */
  .uploader > .dropwrap { align-self: start; grid-template-rows: auto auto; }
  .uploader > .dropwrap > .drop { height: auto; }
}

.drop {
  display: flex; align-items: center; gap: 14px; padding: 15px 16px;
  border: 1px dashed var(--line2); border-radius: var(--r); background: var(--s-2);
  cursor: pointer; transition: border-color .14s, background .14s;
}
.drop:hover { border-color: var(--brand); background: var(--s-3); }
.drop__ico { width: 22px; height: 22px; flex: none; color: var(--brand); }
.drop__t { display: grid; gap: 2px; min-width: 0; }
.drop__t b { font-size: 13px; font-weight: 600; }
.drop__h { font-size: 11.5px; color: var(--ink3); line-height: 1.5; }
/* Visually hidden, still focusable and still the thing the label activates. */
.drop input[type="file"] {
  position: absolute; width: 1px; height: 1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.drop:has(input:focus-visible) { border-color: var(--brand); border-style: solid; }
.drop.is-set { border-style: solid; border-color: color-mix(in srgb, var(--brand) 55%, transparent); }
.drop.is-set .drop__h { color: var(--ink2); }

/* Tall variant: the icon over centred text, for a target that fills a column
   rather than sitting in a row. Collapses back to the compact row on narrow
   screens, where the height it would fill does not exist. */
.drop--tall {
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 10px; padding: 24px 20px; min-height: 132px;
}
.drop--tall .drop__ico { width: 26px; height: 26px; }
.drop--tall .drop__h { max-width: 44ch; }

/* The picker and its queue are one unit. `align-content: start` keeps the
   target its natural height when the column beside it grows a longer list —
   without it a field with one file stretches to match a field with nine. */
.dropwrap { display: grid; align-content: start; gap: 8px; }
.dropgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 760px) {
  .dropgrid { grid-template-columns: 1fr; }
  .drop--tall {
    flex-direction: row; text-align: start; align-items: center;
    padding: 15px 16px; min-height: 0;
  }
  .drop--tall .drop__ico { width: 22px; height: 22px; }
}

/* --------------------------- the queue under a picker ----------------------
   What is about to be uploaded, and the way out of it. Rows are a 3-column
   grid rather than flex so the sizes line up in a column and the × buttons
   sit on one edge — a ragged right margin on a list of controls reads as a
   mistake. `minmax(0, 1fr)` on the name is what lets a long filename
   ellipsize instead of pushing the button off the card. */
.pend__head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink3); padding: 0 2px;
}
.pend__sum { text-transform: none; letter-spacing: 0; font-weight: 500; }

.pend { list-style: none; display: grid; gap: 4px; margin: 0; padding: 0; }
.pend__i {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center; gap: 10px;
  padding: 7px 8px 7px 11px; border-radius: 8px;
  background: var(--s-2); border: 1px solid var(--line);
}
.pend__n {
  font-size: 12.5px; color: var(--ink1);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* A file size is a fixed LTR string. Left to inherit the paragraph direction
   it renders as "MB 2.3" in Arabic — the digits are bidi-weak, so "2.3" and
   "MB" get reordered around each other. `isolate` fences the run off so it
   reads the same in both languages while still sitting on the correct edge. */
.pend__s, .pend__sum {
  font-size: 11px; color: var(--ink3);
  direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums;
}
/* A destructive control, so it is quiet until you are near it. Sized to the
   44px-ish touch target the rest of the product uses, not to the glyph. */
.pend__x {
  display: grid; place-items: center; width: 26px; height: 26px; padding: 0;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  color: var(--ink3); font-size: 17px; line-height: 1;
  transition: background .12s, color .12s;
}
.pend__x:hover { background: rgba(220,60,60,.16); color: #ff9a9a; }
.pend__x:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

.actions--end { justify-content: flex-end; margin-top: 0; }

/* Result of an action, in the form that caused it. Green and red rather than
   one neutral colour, because "added but not emailed" is not good news and
   should not look like it. */
.msg {
  font-size: 12.5px; line-height: 1.6; border-radius: 8px; padding: 10px 12px;
  border: 1px solid; margin: 2px 0;
}
.msg--ok  { color: #8ee89b; background: rgba(12,163,12,.10); border-color: rgba(12,163,12,.35); }
.msg--bad { color: #ffb0b0; background: rgba(208,59,59,.10); border-color: rgba(208,59,59,.38); }

/* ------------------------------ who is here ------------------------------
   The pulse is deliberately slow and small. A fast blink reads as an alarm,
   and "Ameen has the app open" is not an alarm. */
.live { position: relative; display: inline-flex; width: 9px; height: 9px; flex: none; }
.live i {
  position: absolute; inset: 0; border-radius: 50%; background: var(--ok);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 70%, transparent);
  animation: pulse 2.4s ease-out infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 65%, transparent); }
  70%  { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
/* Anyone who has asked not to see motion gets a plain dot. */
@media (prefers-reduced-motion: reduce) { .live i { animation: none; } }

.st--live { gap: 7px; }
.kpi__n .live { margin-inline-end: 9px; vertical-align: middle; }

.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who__t { display: grid; min-width: 0; }
.who__t b { font-size: 13px; font-weight: 600; }
.ava--sm { width: 26px; height: 26px; border-radius: 8px; font-size: 11px; }
/* A ring on the avatar as well as the pill, so the row reads as "here" at a
   glance without having to find the status column. */
.ava--live { box-shadow: 0 0 0 2px var(--s-1), 0 0 0 3.5px var(--ok); }

.stagepick { display: grid; gap: 8px; }
.stagepick__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chk { display: flex; align-items: center; gap: 9px; flex: 1; min-width: min(240px, 100%); font-size: 13px; }
.chk i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.chk input { accent-color: var(--brand); width: 16px; height: 16px; }
.stageWho { height: 32px; padding: 0 8px; border-radius: 7px; background: var(--bg); border: 1px solid var(--line2); font-size: 12.5px; }

.pill {
  display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  color: var(--c); white-space: nowrap;
}

/* ------------------------------- the estimate ----------------------------- */
.estbox:empty { display: none; }
.est {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center;
  margin: 18px 0 4px;
}
.est__side { padding: 14px; border-radius: 10px; background: var(--s-2); border: 1px solid var(--line); display: grid; gap: 4px; }
.est__side--real { border-color: var(--brand); background: linear-gradient(180deg, rgba(145,91,245,.13), transparent); }
.est__k { font-size: 11px; color: var(--ink3); }
.est__v { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.est__note { color: var(--ink2); }
.est__arrow { color: var(--ink4); font-size: 18px; }
@media (max-width: 620px) { .est { grid-template-columns: 1fr; } .est__arrow { display: none; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
