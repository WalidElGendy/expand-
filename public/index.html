<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>expand — know the delivery date before you promise it</title>
<meta name="description" content="Capacity-aware delivery scheduling for Expand's proposal pipeline. Reads what each designer is already committed to and answers when." />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Brand Arabic face, per guideline 5.6–5.8. Latin falls back to Arial,
     which the guideline names as the system font when Helvetica Now is absent. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   expand — delivery estimator
   Brand tokens taken from Brand Guidelines 2025 v1, section 4.5.
   ========================================================================== */
:root {
  color-scheme: dark;

  /* --- brand, verbatim from the guideline --- */
  --black:    #000000;
  --midnight: #5230bf;   /* Midnight Purple */
  --brand:    #915bf5;   /* Purple Heart    */
  --selago:   #e8d9fa;
  --biloba:   #bd96f2;
  --lilac:    #f2ebfa;

  /* --- surfaces --- */
  --bg:   #000000;
  --s-1:  #101014;       /* panel — the surface the palette was validated on */
  --s-2:  #17171d;
  --s-3:  #1f1f28;

  /* --- ink --- */
  --ink1: #ffffff;
  --ink2: #b9b6c6;
  --ink3: #7d7a8c;
  --ink4: #4e4b5c;

  --line:  #232330;
  --line2: #30303f;

  /* --- categorical series ---
     node scripts/validate_palette.js "#915bf5,#d95926,#199e70,#c98500" \
       --mode dark --surface "#101014"   ->  ALL CHECKS PASS
     Brand purple takes slot 1 so the primary team reads as the brand. */
  --s1: #915bf5;   /* 3D      */
  --s2: #d95926;   /* 2D      */
  --s3: #199e70;   /* content */
  --s4: #c98500;

  --ok:       #0ca30c;
  --warn:     #fab219;
  --critical: #d03b3b;

  --sans: "Helvetica Now Display", "Helvetica Neue", Arial, Helvetica, sans-serif;
  --ar: "IBM Plex Sans Arabic", var(--sans);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;

  --r: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink1);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 20px;
}
html[lang="ar"] body { font-family: var(--ar); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

#root { max-width: 1440px; margin: 0 auto; }

/* ------------------------------- header ---------------------------------- */
.head {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 0 4px 20px; position: relative;
}
/* Echo of the brand "Lines System" (guideline 7.0) */
.head::after {
  content: ""; position: absolute; inset-inline-end: 0; top: 0; bottom: 20px; width: 180px;
  background: repeating-linear-gradient(90deg,
    var(--midnight) 0 2px, transparent 2px 9px);
  opacity: .35; mask-image: linear-gradient(90deg, transparent, #000);
  pointer-events: none;
}
html[dir="rtl"] .head::after { transform: scaleX(-1); }
.brand { display: flex; align-items: center; gap: 12px; }
.wordmark {
  font-size: 20px; font-weight: 700; letter-spacing: -.03em; color: var(--ink1);
}
.sep { width: 1px; height: 26px; background: var(--line2); }
.h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.sub { font-size: 12.5px; color: var(--ink3); }
.head__actions { margin-inline-start: auto; display: flex; gap: 8px; z-index: 1; }

.btn {
  height: 34px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
  background: var(--s-2); border: 1px solid var(--line2); color: var(--ink1);
}
.btn:hover { background: var(--s-3); }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #10041f; font-weight: 600; }
.btn--primary:hover { background: var(--biloba); }
.btn--ghost { background: none; color: var(--ink3); }
.btn--ghost:hover { color: var(--ink1); }
.btn--lang { font-family: var(--ar); }

/* -------------------------------- layout --------------------------------- */
.grid { display: grid; grid-template-columns: 280px minmax(0,1fr) 300px; gap: 14px; align-items: start; }
.col { display: grid; gap: 14px; }
@media (max-width: 1180px) { .grid { grid-template-columns: 260px minmax(0,1fr); } }
@media (max-width: 860px)  { .grid { grid-template-columns: 1fr; } }

.card { background: var(--s-1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.card--wide { margin-top: 14px; }
.card__h {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px; border-bottom: 1px solid var(--line);
  font-size: 12.5px; font-weight: 600; letter-spacing: .01em;
}
.card__sub, .badge { margin-inline-start: auto; font-size: 11px; color: var(--ink3); font-family: var(--mono); }
.badge { background: var(--s-3); border-radius: 20px; padding: 1px 8px; }
.card__b { padding: 14px; }
.stack { display: grid; gap: 10px; }
.hint { font-size: 11.5px; color: var(--ink3); line-height: 1.5; }

/* --------------------------------- rows ---------------------------------- */
.row { display: flex; align-items: center; gap: 9px; }
.row__label { font-size: 13px; }
.row__meta { margin-inline-start: auto; font-family: var(--mono); font-size: 11px; color: var(--ink3); }
.row--proj { padding: 7px 9px; background: var(--s-2); border-radius: 8px; }
.row--proj .row__meta { margin-inline-start: 0; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.tag {
  font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
  background: var(--s-3); color: var(--ink2); margin-inline-start: auto;
}
.x { color: var(--ink4); font-size: 16px; line-height: 1; padding: 0 2px; }
.x:hover { color: var(--critical); }

.stepper { margin-inline-start: auto; display: flex; align-items: center; gap: 2px; }
.stepper button {
  width: 24px; height: 24px; border-radius: 6px; background: var(--s-2);
  border: 1px solid var(--line2); color: var(--ink2); font-size: 14px; line-height: 1;
}
.stepper button:hover { background: var(--brand); color: #10041f; border-color: var(--brand); }
.stepper b { min-width: 22px; text-align: center; font-family: var(--mono); font-size: 13px; }

/* --------------------------------- form ---------------------------------- */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f { display: grid; gap: 5px; }
.f--wide { grid-column: 1 / -1; }
.f span { font-size: 11.5px; color: var(--ink3); }
.f input, .f select {
  height: 36px; padding: 0 10px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--line2); outline: 0;
}
.f input:focus, .f select:focus { border-color: var(--brand); }
.actions { display: flex; gap: 8px; margin-top: 12px; }

/* ------------------------------- the result ------------------------------ */
.card--result { border-color: var(--line2); }
.card--empty .empty { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 34px 24px; }
.card--empty p { color: var(--ink3); font-size: 12.5px; max-width: 44ch; }

.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.compare__side { padding: 14px; border-radius: 10px; background: var(--s-2); border: 1px solid var(--line); }
.compare__side--real { border-color: var(--brand); background: linear-gradient(180deg, rgba(145,91,245,.13), transparent); }
.compare__k { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: .06em; }
.compare__v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; }
.compare__side--naive .compare__v { color: var(--ink3); text-decoration: line-through; text-decoration-color: var(--ink4); }
.compare__n { font-size: 11.5px; color: var(--ink3); }
.compare__arrow { text-align: center; display: grid; gap: 2px; padding: 0 4px; }
.compare__arrow b { font-size: 15px; color: var(--warn); font-weight: 700; }
.compare__arrow span { font-size: 10.5px; color: var(--ink3); max-width: 12ch; display: block; }

.deadline { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; }
.deadline.ok  { background: rgba(12,163,12,.12); color: #6ee36e; }
.deadline.bad { background: rgba(208,59,59,.12); color: #ff8f8f; }

.split { margin-top: 16px; }
.split__bar { display: flex; height: 9px; border-radius: 20px; overflow: hidden; background: var(--s-3); }
.split__q { background: repeating-linear-gradient(45deg, var(--ink4) 0 4px, var(--s-3) 4px 8px); }
.split__w { background: var(--brand); }
.split__legend { display: flex; gap: 16px; margin-top: 7px; font-size: 11.5px; color: var(--ink2); }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-inline-end: 6px; }
.sw--q { background: repeating-linear-gradient(45deg, var(--ink4) 0 3px, var(--s-3) 3px 6px); }
.sw--w { background: var(--brand); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 1px; background: var(--line); margin-top: 16px; border-radius: 8px; overflow: hidden; }
.fact { background: var(--s-1); padding: 11px 12px; display: grid; gap: 3px; }
.fact__k { font-size: 10.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; }
.fact__v { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.fact__n { font-size: 11px; color: var(--ink3); line-height: 1.4; }
.conf { text-transform: capitalize; }
.conf--high { color: #6ee36e; } .conf--medium { color: var(--warn); } .conf--low { color: #ff8f8f; }

.sec { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: start; font-size: 10.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; padding: 0 8px 7px; font-weight: 600; }
.tbl td { padding: 8px; border-top: 1px solid var(--line); }
.tbl .n { text-align: end; }
.tbl tr.drive td { background: rgba(145,91,245,.08); }
.tbl tr.err td { color: #ff8f8f; }
.who { color: var(--ink3); font-size: 11.5px; }

/* ------------------------------ utilisation ------------------------------ */
.util { display: grid; gap: 6px; }
.util__h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.util__n { margin-inline-start: auto; font-size: 11px; color: var(--ink3); }
.util__h b { font-family: var(--mono); font-size: 12px; }
.util__h b.warm { color: var(--warn); } .util__h b.hot { color: var(--critical); }
.util__bar { height: 7px; border-radius: 20px; background: var(--s-3); overflow: hidden; }
.util__bar span { display: block; height: 100%; border-radius: 20px; }

.lever { padding: 10px 11px; background: var(--s-2); border-radius: 8px; border: 1px solid var(--line); }
.lever__t { font-size: 12.5px; margin-bottom: 3px; }
.lever__v { font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.lever__s { font-size: 11px; color: #6ee36e; font-weight: 500; }

/* --------------------------------- gantt --------------------------------- */
.gantt { display: grid; gap: 5px; overflow-x: auto; }
.gantt__axis {
  display: grid; grid-template-columns: 120px repeat(var(--cols), minmax(16px, 1fr));
  font-family: var(--mono); font-size: 9.5px; color: var(--ink4); padding-inline-start: 120px;
}
.gantt__axis span { grid-row: 1; }
.gantt__row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; }
.gantt__name { font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt__track {
  display: grid; grid-template-columns: repeat(var(--cols), minmax(16px, 1fr));
  gap: 2px; background: var(--s-2); border-radius: 6px; min-height: 22px; padding: 2px;
}
.bar {
  grid-row: 1; height: 18px; border-radius: 4px; font-size: 10px; color: #10041f;
  display: flex; align-items: center; padding: 0 6px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; font-weight: 600;
}
.bar--new { outline: 2px solid var(--ink1); outline-offset: -2px; }

/* ==========================================================================
   Landing, roster, profiles, pipeline.
   ========================================================================== */

.headtext { min-width: 0; }
.brand { border: 0; background: none; padding: 0; }
.nav { display: flex; gap: 4px; margin-inline-start: 20px; flex-wrap: wrap; }
.navbtn {
  height: 30px; padding: 0 11px; border-radius: 7px; font-size: 12.5px;
  color: var(--ink3); border: 1px solid transparent;
}
.navbtn:hover { color: var(--ink1); background: var(--s-2); }
.navbtn.is-on { color: var(--ink1); background: var(--s-2); border-color: var(--line2); }

.card + .card, .hero + .card { margin-top: 14px; }
.card__head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
}
.card__head h2 { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
.card > :not(.card__head):not(.board):not(.loadlist):not(.deptblock) { padding: 0 16px; }
.card > :not(.card__head):first-child { padding-top: 14px; }
.card > :last-child:not(.board):not(.stats):not(.loadlist) { padding-bottom: 14px; }
.muted { color: var(--ink3); }
.small { font-size: 11.5px; }
.block { display: block; }
.bad { color: #ff8f8f; }
.link { color: var(--brand); font-size: 12.5px; }
.crumb { padding: 0 0 12px; }
.note {
  font-size: 12px; color: var(--ink3); line-height: 1.65;
  border-inline-start: 2px solid var(--line2); padding-inline-start: 11px !important;
  margin: 14px 16px;
}
.note--lead { color: var(--ink2); border-inline-start-color: var(--brand); }
.tbl .num { text-align: end; }
.tbl--tight td { padding: 6px 8px; }
.chip {
  font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink3);
}
.chip--warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

/* ---------------------------------- hero --------------------------------- */
.hero { padding: 46px 4px 34px; max-width: 720px; }
.hero__eyebrow {
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--brand); font-weight: 600; margin-bottom: 16px;
}
.hero__title {
  font-size: clamp(30px, 5.2vw, 52px); line-height: 1.08; letter-spacing: -.035em;
  font-weight: 700; margin-bottom: 16px;
}
.hero__body { font-size: 16px; line-height: 1.6; color: var(--ink2); }
.hero__cta { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
html[lang="ar"] .hero__title { letter-spacing: 0; line-height: 1.25; }

/* -------------------------------- load list ------------------------------ */
.loadlist { display: grid; }
.loadlist__row {
  display: grid; grid-template-columns: 190px minmax(90px,1fr) 96px 128px;
  gap: 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line);
}
.loadlist__row:first-child { border-top: 0; }
.loadlist__who { display: grid; min-width: 0; }
.loadlist__who strong { font-size: 13px; font-weight: 600; }
.loadlist__num { display: grid; text-align: end; }
.loadlist__num strong { font-size: 14px; font-variant-numeric: tabular-nums; }
.loadbar { height: 8px; border-radius: 999px; background: var(--s-3); overflow: hidden; }
.loadbar i { display: block; height: 100%; border-radius: 999px; }
.loadrow { display: grid; gap: 7px; margin-top: 4px; }
@media (max-width: 780px) {
  .loadlist__row { grid-template-columns: 1fr 1fr; }
  .loadlist__who, .loadbar { grid-column: 1 / -1; }
  .loadlist__num { text-align: start; }
}

/* ------------------------------ role picker ------------------------------ */
.deptblock { padding: 16px; border-top: 1px solid var(--line); }
.deptblock:first-of-type { border-top: 0; }
.deptblock__title {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink3); margin-bottom: 11px;
}
.deptblock__title i { width: 8px; height: 8px; border-radius: 3px; }
.whogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 9px; }
.whocard {
  display: grid; gap: 3px; text-align: start; padding: 13px 14px;
  background: var(--s-2); border: 1px solid var(--line2); border-radius: var(--r);
  transition: border-color .14s, transform .14s;
}
.whocard:hover { border-color: var(--brand); transform: translateY(-1px); }
.whocard__name { font-size: 14px; font-weight: 600; }
.whocard__load { color: var(--ink3); margin-top: 4px; }
.whocard--vacant { opacity: .5; cursor: default; }
.whocard--vacant:hover { border-color: var(--line2); transform: none; }

/* -------------------------------- profile -------------------------------- */
.profile__head { display: flex; align-items: center; gap: 14px; padding: 18px 16px; flex-wrap: wrap; }
.avatar {
  width: 46px; height: 46px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-size: 19px; font-weight: 700; color: #10041f;
  background: var(--c, var(--brand));
}
.profile__name { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.profile__head .chip { margin-inline-start: auto; }

.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 1px; background: var(--line); border-block: 1px solid var(--line);
  padding: 0 !important; margin-top: 4px;
}
.stat { background: var(--s-1); padding: 13px 16px; display: grid; gap: 3px; }
.stat__n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat__l { font-size: 11px; color: var(--ink3); line-height: 1.35; }
.stat--bad .stat__n { color: #ff8f8f; }
.stat--wide { grid-column: span 2; }
.stat--wide .stat__n { font-size: 15px; }

/* -------------------------------- pipeline ------------------------------- */
.board {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 1px; background: var(--line);
}
.bcol { background: var(--s-1); padding: 14px; display: grid; gap: 9px; align-content: start; }
.bcol__title {
  display: flex; justify-content: space-between; font-size: 11px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); margin-bottom: 2px;
}
.deal {
  background: var(--s-2); border: 1px solid var(--line2); border-radius: 8px; padding: 11px 12px;
  display: grid; gap: 3px;
}
.deal__name { font-size: 13px; font-weight: 600; }
.deal__ar { direction: rtl; text-align: start; }
html[dir="rtl"] .deal__ar { direction: rtl; }
.deal__meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; }
.deal__cost { color: var(--ink2); border-top: 1px solid var(--line); padding-top: 7px; margin-top: 5px; }

.unpriced { padding: 14px 16px 2px; border-top: 1px solid var(--line); }
.unpriced__head { color: var(--ink3); line-height: 1.6; }
.batches { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.batch {
  display: grid; gap: 2px; padding: 9px 12px; border-radius: 8px;
  background: var(--s-2); border: 1px solid var(--line2); min-width: 128px;
}
.batch__n { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="root"></div>
<script type="module">
// engine/calendar.js
var DEFAULT_WEEKEND = [5, 6];
var DEFAULT_HOLIDAYS = [
  // 2026 — Saudi national holidays. Eid dates are announced by moon sighting
  // and shift by a day or two; confirm each year before relying on them.
  "2026-02-22",
  // Founding Day
  "2026-03-19",
  "2026-03-20",
  "2026-03-21",
  "2026-03-22",
  // Eid al-Fitr (approx)
  "2026-05-26",
  "2026-05-27",
  "2026-05-28",
  "2026-05-29",
  // Eid al-Adha (approx)
  "2026-09-23"
  // National Day
];
var DAY_MS = 864e5;
var iso = (d) => {
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getUTCFullYear()}-${String(x.getUTCMonth() + 1).padStart(2, "0")}-${String(x.getUTCDate()).padStart(2, "0")}`;
};
var parse = (s) => s instanceof Date ? s : /* @__PURE__ */ new Date(String(s) + "T00:00:00Z");
var WorkCalendar = class {
  /**
   * @param {number[]} weekend  day indices, 0 = Sunday
   * @param {string[]} holidays ISO dates
   */
  constructor({ weekend = DEFAULT_WEEKEND, holidays = DEFAULT_HOLIDAYS } = {}) {
    this.weekend = new Set(weekend);
    this.holidays = new Set(holidays);
    this._cache = /* @__PURE__ */ new Map();
  }
  isWorking(date) {
    const s = iso(date);
    if (this._cache.has(s)) return this._cache.get(s);
    const d = parse(s);
    const ok = !this.weekend.has(d.getUTCDay()) && !this.holidays.has(s);
    this._cache.set(s, ok);
    return ok;
  }
  /** The first working day on or after `date`. */
  nextWorking(date) {
    let d = parse(iso(date));
    let guard = 0;
    while (!this.isWorking(d)) {
      d = new Date(d.getTime() + DAY_MS);
      if (++guard > 400) throw new Error("no working day found within a year \u2014 check the holiday list");
    }
